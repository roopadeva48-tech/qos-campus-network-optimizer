<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="qGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Network Circuit Rings Behind -->
  <g transform="translate(250, 160)" stroke="url(#ringGrad)" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M -115 0 A 115 115 0 0 1 115 0" stroke-dasharray="140 15 30 15 60 15" opacity="0.85" />
    <path d="M -115 0 A 115 115 0 0 0 100 50" stroke-dasharray="80 20 120 15" opacity="0.7" />
    <path d="M -90 -20 A 95 95 0 0 1 95 0" stroke-dasharray="70 15 40 10 50 15" />
    <path d="M -90 20 A 95 95 0 0 0 85 -10" stroke-dasharray="100 15 50 10" opacity="0.8" />
    <path d="M -75 0 A 75 75 0 1 1 75 0" stroke-dasharray="90 12 60 12 30 10" opacity="0.9" />

    <circle cx="-115" cy="0" r="4.5" fill="#0284c7" />
    <circle cx="115" cy="0" r="4" fill="#a855f7" />
    <circle cx="65" cy="-95" r="4" fill="#06b6d4" />
    <circle cx="-65" cy="-95" r="4" fill="#38bdf8" />
    <circle cx="95" cy="40" r="3.5" fill="#c084fc" />
    <circle cx="-85" cy="45" r="4.5" fill="#6366f1" />
    <circle cx="-50" cy="70" r="3.5" fill="#818cf8" />
    <circle cx="50" cy="65" r="4" fill="#a855f7" />
    <circle cx="0" cy="-75" r="4" fill="#06b6d4" />
    <circle cx="-40" cy="-65" r="3.5" fill="#38bdf8" />
    <circle cx="40" cy="-65" r="3.5" fill="#c084fc" />
  </g>

  <!-- Glowing Center Q Icon -->
  <g transform="translate(250, 160)" filter="url(#glow)">
    <rect x="-38" y="-45" width="76" height="84" rx="20" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.75" />
    <rect x="-32" y="-39" width="64" height="72" rx="16" fill="url(#qGrad)" />
    <rect x="-17" y="-24" width="34" height="42" rx="8" fill="#FBFBFB" />
    <rect x="-14" y="-21" width="28" height="36" rx="6" fill="#E8F9FF" opacity="0.9" />
    <path d="M 0 10 L 0 32 L 8 32 L 8 10 Z" fill="#FBFBFB" />
    <path d="M -2 12 L -2 30 L 6 30 L 6 12 Z" fill="url(#qGrad)" />
  </g>

  <!-- Dynamic Orbiting Swoosh / Planetary Ring -->
  <g filter="url(#glow)">
    <path d="M 120 145 C 130 95, 230 185, 380 200 C 400 202, 385 220, 350 220 C 230 220, 110 185, 120 145 Z" fill="url(#swooshGrad)" />
    <path d="M 120 145 C 170 190, 270 215, 380 200" stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.9" />
  </g>

  <!-- Typography -->
  <g transform="translate(250, 335)">
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" letter-spacing="3" fill="none" stroke="#818cf8" stroke-width="5" filter="url(#subtleGlow)" opacity="0.8">
      QOS-CAMPUS-NETWORK-OPTIMIZER
    </text>
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" letter-spacing="3" fill="#312e81" stroke="#a855f7" stroke-width="1.2">
      QOS-CAMPUS-NETWORK-OPTIMIZER
    </text>
  </g>
</svg>
